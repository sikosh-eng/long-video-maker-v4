<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Long Video Maker V4</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1117;
      color: #fff;
    }

    .app {
      max-width: 720px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      margin: 5px 0;
      font-size: 30px;
    }

    .subtitle {
      color: #9ca3af;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .card {
      background: #191c25;
      border: 1px solid #292d38;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
    }

    .upload {
      display: block;
      padding: 25px 15px;
      border: 2px dashed #4b5263;
      border-radius: 15px;
      text-align: center;
      color: #d1d5db;
      cursor: pointer;
    }

    .upload:hover {
      border-color: #8b5cf6;
    }

    input[type="file"] {
      display: none;
    }

    .selected {
      margin-top: 12px;
      color: #a78bfa;
      word-break: break-word;
    }

    .image-list {
      margin-top: 15px;
      display: grid;
      gap: 8px;
    }

    .image-item {
      background: #11141c;
      padding: 10px;
      border-radius: 9px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .settings {
      display: grid;
      gap: 14px;
    }

    label {
      display: block;
      color: #cbd5e1;
      font-size: 14px;
    }

    select {
      width: 100%;
      margin-top: 7px;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #343947;
      background: #10131a;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 17px;
      background: #7c3aed;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #6d28d9;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .status {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: #191c25;
      border-radius: 14px;
      white-space: pre-line;
      line-height: 1.6;
      color: #d1d5db;
    }

    .progress {
      height: 8px;
      background: #292d38;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 15px;
      display: none;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #8b5cf6;
      transition: width .3s;
    }

    .info {
      color: #9ca3af;
      font-size: 13px;
      line-height: 1.5;
      margin-top: 12px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>🎬 Long Video Maker V4</h1>

  <div class="subtitle">
    Загрузи только озвучку и картинки.
    Приложение подготовит их для автоматического монтажа.
  </div>


  <!-- AUDIO -->

  <div class="card">

    <h2>🎙️ Озвучка</h2>

    <label class="upload">

      Нажми и выбери MP3 или WAV

      <input
        id="audioInput"
        type="file"
        accept="audio/*"
      >

    </label>

    <div
      id="audioName"
      class="selected">
    </div>

  </div>


  <!-- IMAGES -->

  <div class="card">

    <h2>🖼️ Картинки</h2>

    <label class="upload">

      Нажми и выбери все картинки

      <input
        id="imageInput"
        type="file"
        accept="image/*"
        multiple
      >

    </label>

    <div
      id="imageCount"
      class="selected">
    </div>

    <div
      id="imageList"
      class="image-list">
    </div>

  </div>


  <!-- SETTINGS -->

  <div class="card">

    <h2>⚙️ Настройки</h2>

    <div class="settings">

      <label>
        Формат

        <select id="format">

          <option value="9:16">
            9:16 — Shorts
          </option>

          <option value="16:9">
            16:9 — YouTube
          </option>

          <option value="1:1">
            1:1 — Квадрат
          </option>

        </select>

      </label>


      <label>
        Разрешение

        <select id="resolution">

          <option value="720">
            720p
          </option>

          <option
            value="1080"
            selected>
            1080p
          </option>

          <option value="1440">
            1440p
          </option>

          <option value="2160">
            4K
          </option>

        </select>

      </label>


      <label>
        FPS

        <select id="fps">

          <option value="24">
            24 FPS
          </option>

          <option
            value="30"
            selected>
            30 FPS
          </option>

          <option value="60">
            60 FPS
          </option>

        </select>

      </label>

    </div>

  </div>


  <!-- CREATE -->

  <button id="createButton">
    ✨ СОЗДАТЬ АВТОМОНТАЖ
  </button>


  <div
    id="progress"
    class="progress">

    <div
      id="progressBar"
      class="progress-bar">
    </div>

  </div>


  <div
    id="status"
    class="status">
  </div>


  <div class="info">
    В будущей версии AI будет анализировать содержание
    озвучки и автоматически выбирать подходящие изображения.
  </div>

</div>


<script src="ai.js"></script>
<script src="speech.js"></script>
<script src="app.js"></script>
  <script src="video.js"></script>
  <script src="export.js"></script>
  <script src="whisper.js"></script>
  <script src="ai-matcher.js"></script>
  <script src="pipeline.js"></script>


<script>

const audioInput =
  document.getElementById("audioInput");

const imageInput =
  document.getElementById("imageInput");

const audioName =
  document.getElementById("audioName");

const imageCount =
  document.getElementById("imageCount");

const imageList =
  document.getElementById("imageList");

const createButton =
  document.getElementById("createButton");

const status =
  document.getElementById("status");

const progress =
  document.getElementById("progress");

const progressBar =
  document.getElementById("progressBar");


let selectedAudio = null;
let selectedImages = [];


// ============================================
// AUDIO
// ============================================

audioInput.addEventListener(
  "change",
  function () {

    if (!this.files.length) return;

    selectedAudio =
      this.files[0];

    audioName.textContent =
      "✅ " + selectedAudio.name;

  }
);


// ============================================
// IMAGES
// ============================================

imageInput.addEventListener(
  "change",
  function () {

    selectedImages =
      Array.from(this.files);

    imageCount.textContent =
      "✅ Выбрано: " +
      selectedImages.length;

    imageList.innerHTML = "";


    selectedImages.forEach(
      (file, index) => {

        const item =
          document.createElement("div");

        item.className =
          "image-item";

        item.textContent =
          `${index + 1}. ${file.name}`;

        imageList.appendChild(item);

      }
    );

  }
);


// ============================================
// CREATE
// ============================================

createButton.addEventListener(
  "click",
  async function () {

    if (!selectedAudio) {

      showStatus(
        "❌ Добавь озвучку."
      );

      return;

    }


    if (!selectedImages.length) {

      showStatus(
        "❌ Добавь картинки."
      );

      return;

    }


    createButton.disabled = true;

    progress.style.display =
      "block";

    setProgress(10);

    showStatus(
      "⏳ Читаем озвучку..."
    );


    try {

      const duration =
        await getAudioDuration(
          selectedAudio
        );


      setProgress(30);

      showStatus(
        "⏳ Подготавливаем таймлайн..."
      );


      const timeline =
        createTimeline(
          duration,
          selectedImages
        );


      setProgress(70);


      const format =
        document.getElementById(
          "format"
        ).value;


      const resolution =
        document.getElementById(
          "resolution"
        ).value;


      const fps =
        Number(
          document.getElementById(
            "fps"
          ).value
        );


      setProgress(100);


      let result =
        "✅ Автомонтаж подготовлен!\n\n";

      result +=
        "🎙️ Озвучка: " +
        duration.toFixed(2) +
        " сек.\n\n";

      result +=
        "🖼️ Картинок: " +
        selectedImages.length +
        "\n\n";

      result +=
        "📐 Формат: " +
        format +
        "\n";

      result +=
        "🎥 Разрешение: " +
        resolution +
        "p\n";

      result +=
        "🎞️ FPS: " +
        fps +
        "\n\n";

      result +=
        "Средняя длительность одной картинки: " +
        (
          duration /
          selectedImages.length
        ).toFixed(2) +
        " сек.";


      showStatus(result);


    } catch (error) {

      showStatus(
        "❌ Ошибка:\n" +
        error.message
      );

    }


    createButton.disabled = false;

  }
);


// ============================================
// AUDIO DURATION
// ============================================

function getAudioDuration(file) {

  return new Promise(
    (resolve, reject) => {

      const audio =
        new Audio();

      const url =
        URL.createObjectURL(file);

      audio.src = url;


      audio.onloadedmetadata =
        function () {

          const duration =
            audio.duration;

          URL.revokeObjectURL(
            url
          );

          resolve(duration);

        };


      audio.onerror =
        function () {

          URL.revokeObjectURL(
            url
          );

          reject(
            new Error(
              "Не удалось прочитать аудио."
            )
          );

        };

    }
  );

}


// ============================================
// TIMELINE
// ============================================

function createTimeline(
  duration,
  images
) {

  const timeline = [];

  const part =
    duration /
    images.length;


  images.forEach(
    (image, index) => {

      timeline.push({

        image: image,

        start:
          index * part,

        end:
          (index + 1) * part,

        duration:
          part

      });

    }
  );


  return timeline;

}


// ============================================
// PROGRESS
// ============================================

function setProgress(value) {

  progressBar.style.width =
    value + "%";

}


// ============================================
// STATUS
// ============================================

function showStatus(text) {

  status.style.display =
    "block";

  status.textContent =
    text;

}

</script>

</body>
</html>
