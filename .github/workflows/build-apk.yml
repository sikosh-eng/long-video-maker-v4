name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create clean Flutter project
        run: |
          rm -rf generated_app
          flutter create --platforms=android generated_app

      - name: Copy app code
        run: |
          rm -rf generated_app/lib
          mkdir -p generated_app/lib
          cp -r lib/* generated_app/lib/

      - name: Copy assets
        run: |
          if [ -d "assets" ]; then
            cp -r assets generated_app/assets
          fi

      - name: Configure Android SDK
        working-directory: generated_app
        run: |
          echo "===== BEFORE ====="
          cat android/app/build.gradle.kts
          echo "=================="

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          # Replace ANY compileSdk declaration
          text = re.sub(
              r'(?m)^(\s*)compileSdk(?:Version)?\s*=?.*$',
              r'\1compileSdk = 36',
              text
          )

          # If no compileSdk line existed, add one inside android {}
          if "compileSdk = 36" not in text:
              text = text.replace(
                  "android {",
                  "android {\n    compileSdk = 36",
                  1
              )

          path.write_text(text)

          print("===== AFTER =====")
          print(path.read_text())
          print("=================")
          PY

      - name: Check Android SDK
        working-directory: generated_app
        run: |
          echo "===== FINAL COMPILE SDK ====="
          grep -Rni "compileSdk" android
          echo "============================"

      - name: Get dependencies
        working-directory: generated_app
        run: flutter pub get

      - name: Build APK
        working-directory: generated_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Long-Video-Maker-V4
          path: generated_app/build/app/outputs/flutter-apk/app-release.apk
