name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          rm -rf generated_app
          flutter create --platforms=android generated_app

      - name: Copy application
        run: |
          if [ -d "lib" ]; then
            rm -rf generated_app/lib
            cp -r lib generated_app/lib
          fi

          if [ -d "assets" ]; then
            cp -r assets generated_app/assets
          fi

          cp pubspec.yaml generated_app/pubspec.yaml

      - name: Fix file_picker version
        working-directory: generated_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("pubspec.yaml")
          text = path.read_text()

          text = re.sub(
              r'file_picker:\s*[^\n]+',
              'file_picker: ^8.3.7',
              text
          )

          path.write_text(text)

          print("file_picker fixed to 8.3.7")
          PY

      - name: Set compileSdk 36
        working-directory: generated_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          text = re.sub(
              r'compileSdk\s*=\s*[^\n]+',
              'compileSdk = 36',
              text
          )

          path.write_text(text)

          print("compileSdk = 36")
          PY

      - name: Get dependencies
        working-directory: generated_app
        run: flutter pub get

      - name: Build APK
        working-directory: generated_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Long-Video-Maker-V4
          path: generated_app/build/app/outputs/flutter-apk/app-release.apk
