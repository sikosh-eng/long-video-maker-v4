name: Build APK

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test
        run: echo "GitHub Actions works"
      - name: Build APK
        working-directory: generated_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Long-Video-Maker-V4
          path: generated_app/build/app/outputs/flutter-apk/app-release.apk
