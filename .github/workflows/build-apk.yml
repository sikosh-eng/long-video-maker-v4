name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create clean Flutter project
        run: |
          rm -rf generated_app
          flutter create --platforms=android generated_app

      - name: Copy main.dart
        run: |
          rm -rf generated_app/lib
          mkdir -p generated_app/lib
          cp lib/main.dart generated_app/lib/main.dart

      - name: Add file_picker
        working-directory: generated_app
        run: |
          flutter pub add file_picker:8.3.7

      - name: Set compileSdk 36
        working-directory: generated_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")

          text = path.read_text()

          text = re.sub(
              r'compileSdk\s*=\s*[^\n]+',
              'compileSdk = 36',
              text
          )

          path.write_text(text)

          print("compileSdk configured:")
          for line in text.splitlines():
              if "compileSdk" in line:
                  print(line)
          PY

      - name: Get dependencies
        working-directory: generated_app
        run: flutter pub get

      - name: Build APK
        working-directory: generated_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Long-Video-Maker-V4
          path: generated_app/build/app/outputs/flutter-apk/app-release.apk
