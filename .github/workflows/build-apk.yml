name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --platforms=android generated_app

      - name: Copy application
        run: |
          if [ -d "lib" ]; then
            rm -rf generated_app/lib
            cp -r lib generated_app/lib
          fi

          if [ -f "pubspec.yaml" ]; then
            cp pubspec.yaml generated_app/pubspec.yaml
          fi

      - name: Get packages
        working-directory: generated_app
        run: flutter pub get

      - name: Build APK
        working-directory: generated_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Long-Video-Maker-V4
          path: generated_app/build/app/outputs/flutter-apk/app-release.apk
