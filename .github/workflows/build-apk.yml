name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create clean Flutter project
        run: |
          rm -rf generated_app
          flutter create --platforms=android generated_app

      - name: Force Android compileSdk 36
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("generated_app/android/app/build.gradle.kts"),
              Path("generated_app/android/app/build.gradle")
          ]

          found = False

          for path in files:
              if not path.exists():
                  continue

              found = True
              text = path.read_text()

              lines = []

              for line in text.splitlines():
                  if "compileSdk" in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      if path.suffix == ".kts":
                          line = indent + "compileSdk = 36"
                      else:
                          line = indent + "compileSdk 36"
                  lines.append(line)

              path.write_text("\n".join(lines) + "\n")

              print("Updated:", path)

          if not found:
              raise SystemExit("ERROR: Android Gradle file was not found")
          PY

      - name: Verify compileSdk
        run: |
          echo "===== Android compileSdk ====="
          grep -R "compileSdk" generated_app/android/app/
          echo "=============================="

      - name: Copy lib
        run: |
          if [ -d "lib" ]; then
            rm -rf generated_app/lib
            cp -r lib generated_app/lib
          fi

      - name: Copy assets
        run: |
          if [ -d "assets" ]; then
            cp -r assets generated_app/assets
          fi

      - name: Copy pubspec
        run: |
          if [ -f "pubspec.yaml" ]; then
            cp pubspec.yaml generated_app/pubspec.yaml
          fi

      - name: Get dependencies
        working-directory: generated_app
        run: flutter pub get

      - name: Clean Flutter
        working-directory: generated_app
        run: flutter clean

      - name: Get dependencies again
        working-directory: generated_app
        run: flutter pub get

      - name: Build APK
        working-directory: generated_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Long-Video-Maker-V4
          path: generated_app/build/app/outputs/flutter-apk/app-release.apk
