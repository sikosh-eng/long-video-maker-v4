name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create clean Flutter project
        run: |
          rm -rf generated_app
          flutter create --platforms=android generated_app

      - name: Copy app files
        run: |
          if [ -d "lib" ]; then
            rm -rf generated_app/lib
            cp -r lib generated_app/lib
          fi

          if [ -d "assets" ]; then
            cp -r assets generated_app/assets
          fi

          if [ -f "pubspec.yaml" ]; then
            cp pubspec.yaml generated_app/pubspec.yaml
          fi

      - name: Force compileSdk 36
        working-directory: generated_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")

          if not path.exists():
              raise SystemExit("build.gradle.kts not found")

          text = path.read_text()

          text = re.sub(
              r'compileSdk\s*=\s*[^\n]+',
              'compileSdk = 36',
              text
          )

          path.write_text(text)

          print("Final Android configuration:")
          for line in text.splitlines():
              if "compileSdk" in line:
                  print(line)
          PY

      - name: Install dependencies
        working-directory: generated_app
        run: |
          flutter pub get

      - name: Verify compileSdk
        working-directory: generated_app
        run: |
          echo "=== BUILD.GRADLE.KTS ==="
          grep -n "compileSdk" android/app/build.gradle.kts
          echo "========================"

      - name: Build APK
        working-directory: generated_app
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Long-Video-Maker-V4
          path: generated_app/build/app/outputs/flutter-apk/app-release.apk
