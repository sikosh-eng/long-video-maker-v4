name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create --platforms=android temp_app

      - name: Copy Android folder
        run: |
          rm -rf android
          cp -r temp_app/android android

      - name: Copy Flutter files
        run: |
          mkdir -p temp_app/lib
          cp -r lib/* temp_app/lib/ || true
          cp pubspec.yaml temp_app/pubspec.yaml

      - name: Install dependencies
        working-directory: temp_app
        run: flutter pub get

      - name: Build APK
        working-directory: temp_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: long-video-maker-v4
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
