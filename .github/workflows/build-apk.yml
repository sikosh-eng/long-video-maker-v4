name: Build Long Video Maker APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable

      - name: Create Flutter project
        run: |
          mkdir /tmp/flutter_project
          cd /tmp/flutter_project
          flutter create --platforms=android .

      - name: Copy project files
        run: |
          cp -r /tmp/flutter_project/android .
          cp /tmp/flutter_project/pubspec.yaml .
          cp /tmp/flutter_project/analysis_options.yaml .
          
      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: long-video-maker-v4
          path: build/app/outputs/flutter-apk/app-release.apk
