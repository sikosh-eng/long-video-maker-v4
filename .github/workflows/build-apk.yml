name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create clean Flutter project
        run: |
          flutter create --platforms=android generated_app

      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [
              Path("generated_app/android/app/build.gradle.kts"),
              Path("generated_app/android/app/build.gradle")
          ]

          file = next((p for p in candidates if p.exists()), None)

          if file is None:
              raise SystemExit("Android app Gradle file not found")

          text = file.read_text()

          text, count = re.subn(
              r'compileSdk(?:Version)?\s*(?:=\s*)?(?:flutter\.)?compileSdkVersion',
              'compileSdk = 36',
              text
          )

          if count == 0:
              text, count = re.subn(
                  r'compileSdk(?:Version)?\s*=\s*\d+',
                  'compileSdk = 36',
                  text
              )

          file.write_text(text)

          print(f"Modified: {file}")
          print(f"Replacements: {count}")
          print("--- compileSdk lines ---")

          for line in text.splitlines():
              if "compileSdk" in line:
                  print(line)
          PY

      - name: Copy application code
        run: |
          if [ -d "lib" ]; then
            rm -rf generated_app/lib
            cp -r lib generated_app/lib
          fi

      - name: Copy assets
        run: |
          if [ -d "assets" ]; then
            cp -r assets generated_app/assets
          fi

      - name: Copy pubspec
        run: |
          if [ -f "pubspec.yaml" ]; then
            cp pubspec.yaml generated_app/pubspec.yaml
          fi

      - name: Install dependencies
        working-directory: generated_app
        run: flutter pub get

      - name: Verify Android compile SDK
        working-directory: generated_app
        run: |
          echo "Checking Android configuration..."
          grep -R "compileSdk" android/app/

      - name: Build APK
        working-directory: generated_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Long-Video-Maker-V4
          path: generated_app/build/app/outputs/flutter-apk/app-release.apk
