name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          rm -rf generated_app
          flutter create --platforms=android generated_app

      - name: Copy app code
        run: |
          rm -rf generated_app/lib
          mkdir -p generated_app/lib
          cp -r lib/* generated_app/lib/

      - name: Add file_picker
        working-directory: generated_app
        run: |
          flutter pub add file_picker

      - name: Fix FilePicker API
        working-directory: generated_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/main.dart")
          text = path.read_text()

          # New file_picker API:
          # FilePicker.pickFiles()
          # instead of:
          # FilePicker.platform.pickFiles()

          text = text.replace(
              "FilePicker.platform.pickFiles(",
              "FilePicker.pickFiles("
          )

          path.write_text(text)

          print("FilePicker API updated successfully.")
          PY

      - name: Set Android compileSdk 36
        working-directory: generated_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          text = re.sub(
              r'(?m)^(\s*)compileSdk(?:Version)?\s*=?.*$',
              r'\1compileSdk = 36',
              text
          )

          if "compileSdk = 36" not in text:
              text = text.replace(
                  "android {",
                  "android {\n    compileSdk = 36",
                  1
              )

          path.write_text(text)

          print("compileSdk = 36")
          PY

      - name: Get dependencies
        working-directory: generated_app
        run: flutter pub get

      - name: Build APK
        working-directory: generated_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Long-Video-Maker-V4
          path: generated_app/build/app/outputs/flutter-apk/app-release.apk
