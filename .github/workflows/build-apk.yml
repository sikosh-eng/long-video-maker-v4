name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          flutter create --platforms=android generated_app

      - name: Set Android compile SDK 36
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' generated_app/android/app/build.gradle.kts
          sed -i 's/compileSdk flutter.compileSdkVersion/compileSdk 36/' generated_app/android/app/build.gradle

      - name: Copy application code
        run: |
          if [ -d "lib" ]; then
            rm -rf generated_app/lib
            cp -r lib generated_app/lib
          fi

      - name: Copy assets
        run: |
          if [ -d "assets" ]; then
            cp -r assets generated_app/assets
          fi

      - name: Copy pubspec
        run: |
          if [ -f "pubspec.yaml" ]; then
            cp pubspec.yaml generated_app/pubspec.yaml
          fi

      - name: Install dependencies
        working-directory: generated_app
        run: flutter pub get

      - name: Build APK
        working-directory: generated_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Long-Video-Maker-V4
          path: generated_app/build/app/outputs/flutter-apk/app-release.apk
