name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter project
        run: |
          rm -rf generated_app
          flutter create --platforms=android generated_app

      - name: Copy app
        run: |
          rm -rf generated_app/lib
          mkdir -p generated_app/lib
          cp -r lib/* generated_app/lib/

      - name: Copy pubspec
        run: |
          cp pubspec.yaml generated_app/pubspec.yaml

      - name: Remove default tests
        run: |
          rm -rf generated_app/test

      - name: Fix FilePicker
        working-directory: generated_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("lib/main.dart")
          text = path.read_text()

          text = text.replace(
              "FilePicker.platform.pickFiles(",
              "FilePicker.pickFiles("
          )

          text = text.replace(
              "result.files.isNotEmpty",
              "result.isNotEmpty"
          )

          text = text.replace(
              "result.files.first.name",
              "result.first.name"
          )

          text = text.replace(
              "result.files.map((file) => file.name).toList()",
              "result.map((file) => file.name).toList()"
          )

          text = text.replace(
              "if (result != null && result.isNotEmpty)",
              "if (result.isNotEmpty)"
          )

          text = text.replace(
              "if (result != null)",
              "if (result.isNotEmpty)"
          )

          text = text.replace(
              "allowMultiple: true,",
              ""
          )

          path.write_text(text)
          PY

      - name: Set compileSdk 36
        working-directory: generated_app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          text = re.sub(
              r'(?m)^(\s*)compileSdk(?:Version)?\s*=?.*$',
              r'\1compileSdk = 36',
              text
          )

          if "compileSdk = 36" not in text:
              text = text.replace(
                  "android {",
                  "android {\n    compileSdk = 36",
                  1
              )

          path.write_text(text)
          PY

      - name: Get dependencies
        working-directory: generated_app
        run: flutter pub get

      - name: Analyze
        working-directory: generated_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build APK
        working-directory: generated_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Long-Video-Maker-V4
          path: generated_app/build/app/outputs/flutter-apk/app-release.apk
